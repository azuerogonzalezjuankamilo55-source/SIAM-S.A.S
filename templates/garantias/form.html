{% extends "base.html" %}
{% block title %}Registrar Garantía{% endblock %}
{% block content %}
<h4 class="mb-4">Registrar Garantía</h4>
<div class="card">
    <div class="card-body">
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Cliente *</label>
                    <select name="cliente_id" id="cliente_id" class="form-select" required>
                        <option value="">Seleccione...</option>
                        {% for cl in clientes %}
                        <option value="{{ cl.id }}">{{ cl.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Vehículo *</label>
                    <select name="vehiculo_id" id="vehiculo_id" class="form-select" required>
                        <option value="">Primero seleccione un cliente</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Servicio (opcional)</label>
                    <select name="servicio_id" class="form-select">
                        <option value="">Sin servicio específico</option>
                        {% for s in servicios %}
                        <option value="{{ s.id }}">{{ s.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Meses de validez *</label>
                    <input type="number" name="meses_validez" class="form-control" min="1" max="120" value="3" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Descripción *</label>
                    <textarea name="descripcion" class="form-control" rows="2" required></textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Registrar</button>
                <a href="{{ url_for('garantias.listar') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('cliente_id')?.addEventListener('change', function() {
    const vehSelect = document.getElementById('vehiculo_id');
    vehSelect.innerHTML = '<option value="">Cargando...</option>';
    fetch('/garantias/obtener-vehiculos/' + this.value)
        .then(r => r.json())
        .then(data => {
            vehSelect.innerHTML = '<option value="">Seleccione un vehículo</option>';
            data.forEach(v => {
                vehSelect.innerHTML += `<option value="${v.id}">${v.texto}</option>`;
            });
        });
});
</script>
{% endblock %}
