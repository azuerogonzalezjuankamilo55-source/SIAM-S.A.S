{% extends "base.html" %}
{% block title %}{{ "Editar" if cliente else "Nuevo" }} Cliente{% endblock %}
{% block content %}
<h4 class="mb-4">{{ "Editar" if cliente else "Nuevo" }} Cliente</h4>
<div class="card">
    <div class="card-body">
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre *</label>
                    <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre if cliente else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono if cliente else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Cédula</label>
                    <input type="text" name="cedula" class="form-control" value="{{ cliente.cedula if cliente else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" value="{{ cliente.correo if cliente else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion if cliente else '' }}">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('clientes.listar') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
