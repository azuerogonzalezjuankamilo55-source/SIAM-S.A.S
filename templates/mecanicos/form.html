{% extends "base.html" %}
{% block title %}{{ "Editar" if mecanico else "Nuevo" }} Mecánico{% endblock %}
{% block content %}
<h4 class="mb-4">{{ "Editar" if mecanico else "Nuevo" }} Mecánico</h4>
<div class="card">
    <div class="card-body">
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre *</label>
                    <input type="text" name="nombre" class="form-control" value="{{ mecanico.nombre if mecanico else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control" value="{{ mecanico.telefono if mecanico else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" value="{{ mecanico.correo if mecanico else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Especialidad</label>
                    <input type="text" name="especialidad" class="form-control" value="{{ mecanico.especialidad if mecanico else '' }}">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('mecanicos.listar') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
