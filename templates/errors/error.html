{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="text-center py-5" data-aos="fade-up">
    <i class="bi bi-exclamation-triangle display-1 text-{{ 'danger' if error.status_code >= 500 else 'warning' }}" aria-hidden="true"></i>
    <h2 class="mt-3">Error {{ error.status_code }}</h2>
    <p class="text-muted">{{ error.description }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> Volver al inicio
    </a>
</div>
{% endblock %}
