<nav class="app-navbar px-3 py-2">
    <div class="d-flex align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-soft btn-icon d-md-none" type="button" id="sidebarToggler" aria-label="Abrir menú" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
            {% if current_user.is_authenticated %}
            {% if current_user.foto_path %}
            <img src="{{ current_user.foto_path }}" alt="{{ current_user.nombre }}" class="avatar avatar-sm">
            {% else %}
            <span class="d-flex align-items-center justify-content-center text-primary avatar avatar-sm">
                <i class="fa-solid fa-circle-user fs-4"></i>
            </span>
            {% endif %}
            <div class="lh-1">
                <small class="text-secondary text-uppercase d-none d-sm-block" style="font-size:.68rem;letter-spacing:.5px;">Bienvenido</small>
                <span class="fw-semibold">{{ current_user.nombre }}</span>
            </div>
            {% else %}
            <span class="text-light">Bienvenido</span>
            {% endif %}
        </div>
        <div class="d-flex align-items-center gap-2">
            {% if current_user.is_authenticated %}
            <span class="badge badge-soft-primary d-none d-md-inline">{{ current_user.rol }}</span>
            {% endif %}
            <button class="btn btn-soft btn-icon" id="darkModeToggle" title="Modo oscuro/claro">
                <i class="fa-solid fa-moon"></i>
            </button>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger btn-icon" title="Cerrar sesión">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>
            {% endif %}
        </div>
    </div>
</nav>
