<nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3">
    <div class="d-flex align-items-center">
        <button class="btn btn-dark d-md-none" type="button" data-bs-toggle="collapse" data-bs-target=".sidebar">
            <i class="bi bi-list fs-5"></i>
        </button>
    {% if current_user.is_authenticated %}
        {% if current_user.foto_path %}
        <img src="{{ current_user.foto_path }}" alt="{{ current_user.nombre }}" class="avatar avatar-sm ms-2">
        {% else %}
        <i class="bi bi-person-circle fs-4 ms-2 text-primary"></i>
        {% endif %}
        <span class="ms-2 text-light">Bienvenido, <strong>{{ current_user.nombre }}</strong></span>
    {% else %}
        <span class="ms-2 text-light">Bienvenido</span>
    {% endif %}
    </div>
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-dark btn-sm" id="darkModeToggle" title="Modo oscuro/claro">
            <i class="bi bi-moon-stars"></i>
        </button>
    {% if current_user.is_authenticated %}
        <span class="badge bg-primary">{{ current_user.rol }}</span>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right"></i>
        </a>
    {% endif %}
    </div>
</nav>
