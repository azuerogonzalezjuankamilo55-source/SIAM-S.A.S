{% extends "base.html" %}
{% block title %}{{ "Editar" if cita else "Nueva" }} Cita{% endblock %}
{% block content %}
<h4 class="mb-4">{{ "Editar" if cita else "Nueva" }} Cita</h4>
<div class="card">
    <div class="card-body">
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Cliente *</label>
                    <select name="cliente_id" id="cliente_id" class="form-select" required>
                        <option value="">Seleccione...</option>
                        {% for c in clientes %}
                        <option value="{{ c.id }}" {{ "selected" if cita and cita.cliente_id == c.id else "" }}>{{ c.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Vehículo *</label>
                    <select name="vehiculo_id" id="vehiculo_id" class="form-select" required>
                        <option value="">Primero seleccione un cliente</option>
                        {% if cita %}
                        <option value="{{ cita.vehiculo_id }}" selected>{{ cita.vehiculo.marca }} {{ cita.vehiculo.modelo }} - {{ cita.vehiculo.placa }}</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Mecánico</label>
                    <select name="mecanico_id" class="form-select">
                        <option value="">Sin asignar</option>
                        {% for m in mecanicos %}
                        <option value="{{ m.id }}" {{ "selected" if cita and cita.mecanico_id == m.id else "" }}>{{ m.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sede</label>
                    <select name="sede_id" id="sede_id" class="form-select">
                        <option value="">Sin sede</option>
                        {% for s in sedes %}
                        <option value="{{ s.id }}" {{ "selected" if cita and cita.sede_id == s.id else "" }}>{{ s.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Servicio</label>
                    <select name="servicio_id" class="form-select">
                        <option value="">Sin servicio específico</option>
                        {% for sv in servicios %}
                        <option value="{{ sv.id }}" {{ "selected" if cita and cita.servicio_id == sv.id else "" }}>{{ sv.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha *</label>
                    <input type="date" name="fecha" id="fecha" class="form-control" value="{{ cita.fecha if cita else '' }}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Hora *</label>
                    <input type="time" name="hora" id="hora" class="form-control" value="{{ cita.hora if cita else '' }}" list="listaHoras" required>
                    <datalist id="listaHoras"></datalist>
                    <div class="form-text" id="hintHoras"></div>
                </div>
                {% if cita %}
                <div class="col-md-2">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        {% for estado, etiqueta in [
                            ("pendiente", "Pendiente"),
                            ("confirmada", "Confirmada"),
                            ("en_revision", "En revisión"),
                            ("en_reparacion", "En reparación"),
                            ("lista", "Lista"),
                            ("entregada", "Entregada"),
                            ("cancelado", "Cancelada")
                        ] %}
                        <option value="{{ estado }}" {{ "selected" if cita.estado == estado else "" }}>{{ etiqueta }}</option>
                        {% endfor %}
                        {% if cita.estado in ("en_proceso", "completado") %}
                        <option value="{{ cita.estado }}" selected>{{ cita.estado_etiqueta }} (legado)</option>
                        {% endif %}
                    </select>
                </div>
                {% endif %}
                <div class="col-12">
                    <label class="form-label">Descripción / Observaciones</label>
                    <textarea name="descripcion" class="form-control" rows="3">{{ cita.descripcion if cita else '' }}</textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('citas.listar') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('cliente_id')?.addEventListener('change', function() {
    const vehSelect = document.getElementById('vehiculo_id');
    vehSelect.innerHTML = '<option value="">Cargando...</option>';
    fetch('/citas/obtener-vehiculos/' + this.value)
        .then(r => r.json())
        .then(data => {
            vehSelect.innerHTML = '<option value="">Seleccione un vehículo</option>';
            data.forEach(v => {
                vehSelect.innerHTML += `<option value="${v.id}">${v.texto}</option>`;
            });
        });
});

function cargarHorasDisponibles() {
    const fecha = document.getElementById('fecha');
    const sede = document.getElementById('sede_id');
    const lista = document.getElementById('listaHoras');
    const hint = document.getElementById('hintHoras');
    if (!lista || !hint) return;
    if (!fecha || !fecha.value) { lista.innerHTML = ''; hint.textContent = ''; return; }
    const params = new URLSearchParams({ fecha: fecha.value });
    if (sede && sede.value) params.set('sede_id', sede.value);
    {% if cita %}params.set('cita_id', '{{ cita.id }}');{% endif %}
    fetch('/api/horas-disponibles?' + params.toString())
        .then(r => r.json())
        .then(data => {
            const horas = (data && data.horas) || [];
            lista.innerHTML = horas.map(h => `<option value="${h}">`).join('');
            hint.textContent = horas.length
                ? `${horas.length} horario(s) disponible(s)`
                : 'Sin horarios disponibles para esa fecha y sede';
        })
        .catch(() => {});
}
['sede_id', 'fecha'].forEach(function (id) {
    document.getElementById(id)?.addEventListener('change', cargarHorasDisponibles);
});
cargarHorasDisponibles();
</script>
{% endblock %}
